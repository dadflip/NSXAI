services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount your pipeline outputs here — no rebuild needed when CSV changes
      - ./artifacts:/api/artifacts:ro
    environment:
      - ARTIFACTS_DIR=/api/artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
